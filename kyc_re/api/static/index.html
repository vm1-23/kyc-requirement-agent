      return {name:$("#hp-name").value.trim()||`Stakeholder input · ${new Date().toLocaleDateString(undefined,{day:"numeric",month:"short"})}`,jurisdictions:j.length?j:["GLOBAL"],
        description:$("#np-desc").value.trim(),channels:csv($("#np-ch").value),customer_types:csv($("#np-ct").value),legacy_systems:csv($("#np-ls").value),
        timeline_months:n("#np-tl"),team_size:n("#np-ts"),budget_flexibility:$("#np-bf").value}};
    const analyse=btn=>{if(!S.paste.trim()){toast("Paste what people said first, or open a demo below.");ta.focus();return}
      const proj=project();
      busy(btn,"Analysing",async()=>{
        const r=await post("/api/projects",proj);await refreshProjects();
        await post(`/api/projects/${r.id}/conversation`,{text:S.paste,title:"Stakeholder input",roles:S.roleOv,names:S.nameOv,run:true});
        Object.assign(S,{paste:"",speakers:[],roleOv:{},nameOv:{},homeName:""});
        if(!S.pid){await selectProject(r.id);toast(`“${proj.name}” is analysed.`,"ok")}  // still on the start page: show it
        else{await refreshProjects();toast(`“${proj.name}” is analysed. Open it from the panel when you're ready.`,"ok",8000)}  // presenting a demo: don't interrupt
      },"any")};
    on("#pz-run",analyse);ctrlEnter(ta,()=>analyse($("#pz-run")));
    on("#np-empty",g=>busy(g,"Creating project",async()=>{const r=await post("/api/projects",project());await refreshProjects();S.queue=[];await selectProject(r.id);go("Inputs");toast("Project created. Upload documents or paste text.","ok")}));
    return}
  on("#demo-reset",()=>{if(confirm("Reset this demo to its original analysis? Answers and decisions made in it are discarded."))openDemo(S.pid.replace(/^demo-/,"").replaceAll("-","_"),true)});
  on("#rerun",runAnalysis);on("#rerun2",runAnalysis)},
Inputs:()=>{
  // --- the main path: one pasted text, split into people ---
  const ta=$("#pz-text");let timer;
  ta.oninput=()=>{S.paste=ta.value;clearTimeout(timer);timer=setTimeout(refreshPeople,350);if(!ta.value.trim()){S.speakers=[];renderPeople()}};
  $("#pz-title").oninput=e=>S.pasteTitle=e.target.value;
  on("#pz-example",()=>{ta.value=S.paste=PASTE_EXAMPLE;if(!S.pasteTitle){S.pasteTitle="Kick-off workshop";$("#pz-title").value=S.pasteTitle}refreshPeople();ta.focus()});
  const submitPaste=(btn,run)=>{if(!S.paste.trim()){toast("Paste what people said first.");ta.focus();return}
    busy(btn,run?"Adding and analysing":"Adding",async()=>{
      const r=await post(`/api/projects/${S.pid}/conversation`,{text:S.paste,title:S.pasteTitle,roles:S.roleOv,names:S.nameOv,run});
      Object.assign(S,{paste:"",pasteTitle:"",speakers:[],roleOv:{},nameOv:{}});
      const pii=r.documents.reduce((a,x)=>a+x.pii_masked,0);
      await load();toast(`Added input from ${plural(r.documents.length,"person","people")}${pii?` · ${plural(pii,"PII value")} masked`:""}${run?"":" · not analysed yet"}`,"ok",6000)},run)};
  on("#pz-run",b=>submitPaste(b,true));on("#pz-add",b=>submitPaste(b,false));ctrlEnter(ta,()=>submitPaste($("#pz-run"),true));
  renderPeople();if(S.paste&&!S.speakers.length)refreshPeople();

  // --- secondary path: files ---
  const drop=$("#drop"),pick=$("#file-pick");
  drop.onclick=()=>{pick.value="";pick.click()};drop.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();drop.click()}};
  pick.onchange=()=>readFiles(pick.files);
  drop.ondragover=e=>{e.preventDefault();drop.classList.add("over")};drop.ondragleave=()=>drop.classList.remove("over");
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");readFiles(e.dataTransfer.files)};
  $("#df-st").oninput=e=>S.defaults.stakeholder=e.target.value;$("#df-role").onchange=e=>S.defaults.role=e.target.value;
  on("#df-apply",()=>{S.queue.forEach(x=>{if(S.defaults.stakeholder)x.stakeholder=S.defaults.stakeholder;if(S.defaults.role)x.role=S.defaults.role});render()});
  $$(".qitem").forEach(el=>{const it=S.queue.find(x=>x.id===+el.dataset.qi);el.querySelectorAll("[data-f]").forEach(inp=>{inp.oninput=inp.onchange=()=>{it[inp.dataset.f]=inp.value}})});
  $$("[data-rm]").forEach(b=>b.onclick=()=>{S.queue=S.queue.filter(x=>x.id!==+b.dataset.rm);render()});
  on("#q-clear",()=>{if(confirm(`Remove all ${S.queue.length} queued files?`)){S.queue=[];render()}});
  const submit=(btn,run)=>{const docs=S.queue.filter(x=>x.text.trim());if(!docs.length){toast("The queued files have no text.");return}
    busy(btn,run?`Adding ${plural(docs.length,"file")} and analysing`:`Adding ${plural(docs.length,"file")}`,async()=>{
      const r=await post(`/api/projects/${S.pid}/documents/batch`,{run,documents:docs.map(x=>({title:x.title||"Input",text:x.text,type:x.type,stakeholder:x.stakeholder,role:x.role||null}))});
      const ids=new Set(docs.map(x=>x.id));S.queue=S.queue.filter(x=>!ids.has(x.id));
      const pii=r.documents.reduce((a,x)=>a+x.pii_masked,0),inj=r.documents.filter(x=>x.injection_flags.length).length;
      await load();toast(`Added ${plural(r.documents.length,"file")} · ${plural(pii,"PII value")} masked${inj?` · injection quarantined in ${inj}`:""}${run?"":" · not analysed yet"}`,"ok",6000)},run)};
  on("#q-add",b=>submit(b,false));on("#q-run",b=>submit(b,true));on("#in-run",runAnalysis);
  $$("tr[data-doc]").forEach(tr=>tr.onclick=()=>{const body=document.querySelector(`tr[data-doc-body="${CSS.escape(tr.dataset.doc)}"]`);body.classList.toggle("hidden");tr.querySelector("td:last-child .i").style.transform=body.classList.contains("hidden")?"":"rotate(90deg)"})},
Interview:()=>{
  on("#iv-start",b=>busy(b,"Starting interview",async()=>{S.interview=await post(`/api/projects/${S.pid}/interviews`,{stakeholder:$("#iv-name").value.trim()||"Stakeholder",role:$("#iv-role").value});render();$("#iv-ans")?.focus()}));
  const chat=$("#chat");if(chat)chat.scrollTop=chat.scrollHeight;
  const send=()=>{const a=$("#iv-ans").value.trim();if(!a){toast("Type an answer first.");return}
    busy($("#iv-send"),"Sending",async()=>{S.interview=await post(`/api/projects/${S.pid}/interviews/${S.interview.id}/answer`,{answer:a});render();$("#iv-ans")?.focus()})};
  on("#iv-send",send);ctrlEnter($("#iv-ans"),send);
  on("#iv-cancel",()=>{if(confirm("Discard this interview? The answers are not saved.")){S.interview=null;render()}});
  on("#iv-finish",b=>{if(!S.interview.turns.some(t=>t.answer)){toast("Answer at least one question first.");return}
    busy(b,"Analysing interview",async()=>{await post(`/api/projects/${S.pid}/interviews/${S.interview.id}/finish`);S.interview=null;await load();go("Requirements");toast("Interview added and analysed.","ok")},true)})},
Requirements:()=>{if(!$("#rq"))return;
  const apply=()=>{const q=S.f.rqQ.trim().toLowerCase();let n=0;const rows=$$("#rq tbody tr");
    rows.forEach(r=>{const hide=(S.f.rqCat&&!r.dataset.cat.split(" ").includes(S.f.rqCat))||(S.f.rqSt&&r.dataset.st!==S.f.rqSt)||(S.f.rqPri&&r.dataset.pri!==S.f.rqPri)||(q&&!r.dataset.txt.includes(q));r.classList.toggle("hidden",hide);if(!hide)n++});
    $("#rq-n").textContent=`${n} of ${rows.length}`;$("#rq-none").classList.toggle("hidden",n>0);$("#rq").classList.toggle("hidden",n===0);
    $$("#rq-cats button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.catF===S.f.rqCat)))};
  $("#rq-q").oninput=e=>{S.f.rqQ=e.target.value;apply()};$("#rq-st").onchange=e=>{S.f.rqSt=e.target.value;apply()};$("#rq-pri").onchange=e=>{S.f.rqPri=e.target.value;apply()};
  $$("#rq-cats button").forEach(b=>b.onclick=()=>{S.f.rqCat=b.dataset.catF;apply()});
  on("#rq-reset",()=>{Object.assign(S.f,{rqQ:"",rqCat:"",rqSt:"",rqPri:""});render()});apply()},
Clarifications:()=>{$("#cl-mine").onchange=e=>{S.f.clMine=e.target.checked;render()};
  const submit=b=>{const q=b.dataset.qa,a=document.querySelector(`[data-q="${CSS.escape(q)}"]`).value.trim();if(!a){toast("Type an answer first.");return}
    busy(b,"Applying answer",async()=>{await post(`/api/projects/${S.pid}/questions/${encodeURIComponent(q)}/answer`,{answer:a});await load();toast("Answer applied and analysis re-run.","ok")},true)};
  $$("[data-qa]").forEach(b=>{b.onclick=()=>submit(b);ctrlEnter(document.querySelector(`[data-q="${CSS.escape(b.dataset.qa)}"]`),()=>submit(b))})},
Risks:()=>{$$("[data-cell]").forEach(b=>b.onclick=()=>{S.f.risk=S.f.risk===b.dataset.cell?"":b.dataset.cell;render()});on("#risk-clear",()=>{S.f.risk="";render()})},
Approvals:()=>bindDecisions($("#view")),
Audit:async()=>{try{const a=await api(`/api/projects/${S.pid}/audit`);if(S.page!=="Audit"||!$("#audit"))return;
  const draw=()=>{const q=S.f.au.toLowerCase(),ev=a.events.slice().reverse().filter(e=>!q||(e.actor+" "+e.action+" "+e.subject).toLowerCase().includes(q));
    $("#audit-body").innerHTML=ev.map(e=>`<tr class="click" data-ev="${e.seq}"><td class="mono xs muted">${e.seq}</td><td class="sm" style="white-space:nowrap">${fmtTime(e.ts)}</td><td>${tag(e.actor,e.actor.startsWith("user:")?"":"mono")}</td><td><b class="sm">${esc(cap(e.action))}</b></td><td class="mono xs">${esc(e.subject)}</td></tr>
      <tr class="hidden" data-ev-body="${e.seq}"><td colspan="5" style="background:var(--surface-2)"><pre class="code">${esc(JSON.stringify(e.payload,null,2))}</pre></td></tr>`).join("")||`<tr><td colspan="5">${empty("search","No matching events","")}</td></tr>`;
    $$("tr[data-ev]").forEach(tr=>tr.onclick=()=>document.querySelector(`tr[data-ev-body="${tr.dataset.ev}"]`).classList.toggle("hidden"))};
  $("#audit").innerHTML=`<div class="callout ${a.verified?"ok":"bad"}" style="margin-bottom:16px">${I(a.verified?"lock":"alert",16)}<div><b>${a.verified?"Hash chain verified":"Hash chain broken"}</b> · ${plural(a.events.length,"event")} · head <code>${esc(a.head.slice(0,20))}…</code></div></div>
    <div class="card"><div class="card-b" style="padding-bottom:12px"><div class="search" style="max-width:none">${I("search",15)}<input id="au-q" class="input" type="search" placeholder="Filter by actor, action or subject…" value="${esc(S.f.au)}"></div></div>
    <div class="tw"><table><thead><tr><th>#</th><th>Time</th><th>Actor</th><th>Action</th><th>Subject</th></tr></thead><tbody id="audit-body"></tbody></table></div></div>`;
  $("#au-q").oninput=e=>{S.f.au=e.target.value;draw()};draw()}
  catch(e){if($("#audit"))$("#audit").innerHTML=`<div class="callout bad">${I("alert",15)}<div>${esc(e.message)}</div></div>`}},
Knowledge:()=>{
  if(!S.kb){api("/api/kb").then(k=>{S.kb=k;if(S.page==="Knowledge")render()}).catch(e=>toast(e.message,"bad"));return}
  const apply=()=>{const q=S.f.kbQ.toLowerCase(),j=S.f.kbJ;$$("#kb tbody tr").forEach(r=>r.classList.toggle("hidden",(q&&!r.dataset.txt.includes(q))||(j&&!r.dataset.j.split(" ").includes(j))))};
  $("#kb-q").oninput=e=>{S.f.kbQ=e.target.value;apply()};$("#kb-j").onchange=e=>{S.f.kbJ=e.target.value;apply()};apply()},
};
init();
</script>
</body>
</html>
