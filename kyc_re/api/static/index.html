<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KYC Requirement Studio</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1c2330;--muted:#5d6878;--line:#e2e6ec;--accent:#2457c5;--accent-ink:#fff;
--ok:#1f7a4d;--warn:#a45d00;--bad:#b42318;--chip:#eef2f8;--code:#f1f3f6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--panel:#171c23;--ink:#e6e9ee;--muted:#9aa4b2;--line:#2a313b;--accent:#6f9bff;--accent-ink:#0b0f14;--ok:#4cc38a;--warn:#f0a43a;--bad:#ff7a6e;--chip:#202733;--code:#1d232c}}
:root[data-theme="dark"]{--bg:#0f1318;--panel:#171c23;--ink:#e6e9ee;--muted:#9aa4b2;--line:#2a313b;--accent:#6f9bff;--accent-ink:#0b0f14;--ok:#4cc38a;--warn:#f0a43a;--bad:#ff7a6e;--chip:#202733;--code:#1d232c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
h1{font-size:16px;margin:0}h2{font-size:15px;margin:0 0 10px}h3{font-size:14px;margin:14px 0 6px}
.sub{color:var(--muted);font-size:12px}
main{max-width:1280px;margin:0 auto;padding:16px}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
nav button{white-space:nowrap}
button,select,input,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav button.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
textarea{width:100%;min-height:110px}input[type=text]{width:100%}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;overflow-x:auto}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kpi .v{font-size:22px;font-weight:650}.kpi .l{color:var(--muted);font-size:12px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 8px;margin:1px 2px;font-size:11.5px;white-space:nowrap}
.s-approved,.ok{color:var(--ok)}.s-needs_clarification,.warn{color:var(--warn)}.s-rejected,.bad{color:var(--bad)}
.lvl-critical{color:var(--bad);font-weight:600}.lvl-high{color:var(--bad)}.lvl-medium{color:var(--warn)}
.bar{height:10px;background:var(--chip);border-radius:6px;overflow:hidden}.bar>span{display:block;height:100%;background:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:12px}
pre{background:var(--code);padding:8px;border-radius:6px;white-space:pre-wrap;font-size:12px;max-height:340px;overflow:auto}
.hidden{display:none}
#toast{position:fixed;bottom:16px;right:16px;max-width:420px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;opacity:0;transition:opacity .2s}
#toast.show{opacity:1}
@media (max-width:640px){main{padding:12px}header{padding:10px 12px}}
</style>
</head>
<body>
<header>
  <div><h1>KYC Requirement Studio</h1><div class="sub" id="health">Multi-agent requirement engineering for customer onboarding & KYC</div></div>
  <div class="row">
    <select id="project"></select>
    <label class="small muted">Acting as</label>
    <input id="user" type="text" value="demo.user" style="width:120px" aria-label="user">
    <select id="role" aria-label="role"></select>
  </div>
</header>
<main>
  <nav id="tabs"></nav>
  <section id="view"></section>
</main>
<div id="toast"></div>
<script>
const ROLES=["product_owner","business_analyst","compliance","legal","security","architect","project_manager","operations","risk","auditor","developer","customer"];
const TABS=["Overview","Inputs","Interview","Requirements","Clarifications","Conflicts","Compliance","Risks","SDLC","Approvals","Audit"];
let S={pid:null,data:null,tab:"Overview",interview:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3500)}
async function api(path,opt={}){const h={"Content-Type":"application/json","X-User":$("#user").value||"anonymous","X-Role":$("#role").value};
  const r=await fetch(path,{...opt,headers:{...h,...(opt.headers||{})}});if(!r.ok){let d;try{d=(await r.json()).detail}catch{d=r.statusText}throw new Error(typeof d==="string"?d:JSON.stringify(d))}
  return r.headers.get("content-type")?.includes("json")?r.json():r}
const pct=x=>Math.round((x||0)*100)+"%";
const chips=a=>(a||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join("");

async function init(){
  $("#role").innerHTML=ROLES.map(r=>`<option>${r}</option>`).join("");
  try{const h=await api("/api/health");$("#health").textContent=`LLM: ${h.llm} · Knowledge base v${h.kb_version}`}catch(e){}
  $("#tabs").innerHTML=TABS.map(t=>`<button data-t="${t}">${t}</button>`).join("");
  $("#tabs").onclick=e=>{if(e.target.dataset.t){S.tab=e.target.dataset.t;render()}};
  $("#project").onchange=async e=>{S.pid=e.target.value||null;await load()};
  await refreshProjects();render();
}
async function refreshProjects(sel){
  const ps=await api("/api/projects");
  $("#project").innerHTML=`<option value="">— select project —</option>`+ps.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");
  if(sel){$("#project").value=sel;S.pid=sel}
}
async function load(){S.data=S.pid?await api(`/api/projects/${S.pid}`):null;render()}

function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("active",b.dataset.t===S.tab));
  const v=$("#view");
  if(!S.data&&S.tab!=="Overview"){v.innerHTML=`<div class="panel muted">Select or create a project first.</div>`;return}
  v.innerHTML=(VIEWS[S.tab]||(()=>""))(S.data);
  (BIND[S.tab]||(()=>{}))();
}

const VIEWS={
Overview:d=>{
  let h=`<div class="panel"><h2>Start</h2><div class="row">
    <button class="primary" data-sample="kyc_onboarding">Load NeoBank (IN) case study</button>
    <button data-sample="eu_merchant_onboarding">Load PayFlow (EU)</button>
    <button data-sample="us_wealth_onboarding">Load Summit (US)</button></div>
    <h3>…or create an empty project</h3><div class="row">
    <input id="np-name" type="text" placeholder="Project name" style="max-width:280px">
    <select id="np-j"><option>IN</option><option>EU</option><option>US</option></select>
    <button id="np-go">Create</button></div></div>`;
  if(!d)return h;
  const m=d.metrics||{};
  const k=(v,l)=>`<div class="panel kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  h+=`<div class="panel"><h2>${esc(d.project.name)}</h2><div class="muted small">${esc(d.project.description)}</div>
    <div class="row small" style="margin-top:6px">Jurisdictions ${chips(d.project.jurisdictions)} · engine <b>${esc(d.llm)}</b></div></div>
  <div class="grid">${k(m.requirements_total??0,"requirements ("+(m.requirements_derived??0)+" derived)")}${k(m.needs_clarification??0,"need clarification")}
  ${k(m.conflicts_open_high??0,"open high/critical conflicts")}${k(pct(m.control_coverage_stakeholder),"control coverage from stakeholders")}
  ${k(pct(m.control_coverage_after_derivation),"coverage after derivation")}${k(pct(m.citation_validity),"citation validity")}
  ${k(m.pii_masked??0,"PII values masked")}${k(m.injection_quarantined??0,"injected sentences quarantined")}</div>
  <div class="panel"><h3>Baseline quality gates</h3>${Object.entries(m.gates||{}).map(([g,ok])=>`<div>${ok?'<span class="ok">✔</span>':'<span class="bad">✘</span>'} ${g.replaceAll("_"," ")}</div>`).join("")}
  <div class="row" style="margin-top:10px"><button id="rerun">Re-run agents</button><a href="/api/projects/${S.pid}/export"><button class="primary">Download artefacts (SRS.docx, RTM, …)</button></a></div></div>`;
  return h},
Inputs:d=>`<div class="panel"><h2>Add stakeholder input</h2>
  <div class="grid"><input id="di-title" type="text" placeholder="Title"><input id="di-st" type="text" placeholder="Stakeholder name">
  <select id="di-role">${ROLES.map(r=>`<option>${r}</option>`).join("")}</select>
  <select id="di-type">${["meeting_notes","transcript","email","questionnaire","requirement_doc","policy","legacy_doc","api_spec","incident_report","audit_finding"].map(t=>`<option>${t}</option>`).join("")}</select></div>
  <textarea id="di-text" placeholder="Paste conversation, email, notes or document text. PII is masked before any agent sees it."></textarea>
  <div class="row"><button class="primary" id="di-add">Add & re-run</button></div></div>
  <div class="panel"><h2>Ingested sources (masked view)</h2><table><tr><th>ID</th><th>Title</th><th>Stakeholder</th><th>PII</th><th>Injection</th><th>Masked text</th></tr>
  ${d.documents.map(x=>`<tr><td>${x.id}</td><td>${esc(x.title)}<div class="muted small">${x.type}</div></td><td>${esc(x.stakeholder)}<div class="muted small">${x.role||""}</div></td>
  <td>${chips([...new Set(x.pii_findings.map(p=>p.type))])}</td><td class="${x.injection_flags.length?'bad':''}">${chips(x.injection_flags)||"-"}</td><td><pre>${esc(x.masked_text)}</pre></td></tr>`).join("")}</table></div>`,
Interview:d=>{const s=S.interview;
  if(!s)return `<div class="panel"><h2>Adaptive stakeholder interview</h2><p class="muted small">The interaction agent picks questions by role, follows up on vague answers, and skips topics already covered.</p>
   <div class="row"><input id="iv-name" type="text" placeholder="Stakeholder name" style="max-width:240px"><select id="iv-role">${ROLES.map(r=>`<option>${r}</option>`).join("")}</select><button class="primary" id="iv-start">Start</button></div></div>`;
  return `<div class="panel"><h2>Interview: ${esc(s.stakeholder)} (${s.role})</h2>
   ${s.turns.map(t=>`<div style="margin:8px 0"><div><span class="chip">${t.topic}${t.followup?" · follow-up":""}</span> <b>${esc(t.question)}</b></div>${t.answer?`<div class="muted">↳ ${esc(t.answer)}</div>`:""}</div>`).join("")}
   ${s.done?'<p class="ok">Interview complete.</p>':`<textarea id="iv-ans" placeholder="Answer…"></textarea><div class="row"><button class="primary" id="iv-send">Send answer</button></div>`}
   <div class="row" style="margin-top:8px"><button id="iv-finish">Finish & analyse</button></div></div>`},
Requirements:d=>{const cats=[...new Set(d.requirements.flatMap(r=>r.categories))];
  return `<div class="panel"><div class="row"><h2 style="margin:0">Requirements</h2><select id="rq-cat"><option value="">all categories</option>${cats.map(c=>`<option>${c}</option>`).join("")}</select>
  <select id="rq-st"><option value="">all statuses</option>${["needs_clarification","pending_approval","approved","modified","rejected"].map(c=>`<option>${c}</option>`).join("")}</select></div>
  <table id="rq"><tr><th>ID</th><th>Requirement</th><th>Categories</th><th>Source</th><th>Regulations / controls</th><th>Risk</th><th>Conf.</th><th>Status</th></tr>
  ${d.requirements.map(r=>`<tr data-cat="${r.categories.join(" ")}" data-st="${r.status}"><td><b>${r.id}</b><div class="muted small">${r.priority} · ${r.origin}</div></td>
  <td>${esc(r.statement)}${r.quality_issues.length?`<div class="small warn">${r.quality_issues.map(i=>`[${i.type}] ${esc(i.detail)}`).join("<br>")}</div>`:""}
  <details class="small"><summary class="muted">acceptance criteria · evidence</summary><ul>${r.acceptance_criteria.map(a=>`<li>${esc(a)}</li>`).join("")}</ul>${r.evidence.map(e=>`<div class="muted">“${esc(e.excerpt)}” — ${esc(e.doc_id)}</div>`).join("")}</details></td>
  <td>${chips(r.categories)}</td><td class="small">${esc(r.source_stakeholder||"-")}</td><td>${chips(r.regulations.map(c=>c.kb_id))}${chips(r.controls)}</td>
  <td class="lvl-${r.risk_level}">${r.risk_level}</td><td>${r.confidence.toFixed(2)}</td><td class="s-${r.status}">${r.status.replaceAll("_"," ")}</td></tr>`).join("")}</table></div>
  <div class="panel"><h2>User stories</h2>${d.stories.slice(0,200).map(s=>`<div class="small" style="margin:4px 0"><b>${s.id}</b> ${esc(s.story)}</div>`).join("")}</div>
  <div class="panel"><h2>Use cases</h2>${d.use_cases.map(u=>`<h3>${u.id} ${esc(u.name)}</h3><div class="small muted">Actor: ${esc(u.actor)} · Requirements: ${u.requirements.join(", ")}</div><ol class="small">${u.main.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`).join("")}</div>`},
Clarifications:d=>`<div class="panel"><h2>Clarification questions</h2><table><tr><th>ID</th><th>For</th><th>Question</th><th>Reason</th><th>Answer</th></tr>
  ${d.questions.map(q=>`<tr><td>${q.id}<div class="muted small">${q.requirement_id||""}</div></td><td>${q.target_role||""}</td><td>${esc(q.question)}</td><td class="small muted">${esc(q.reason)}</td>
  <td>${q.answer?`<span class="ok">${esc(q.answer)}</span>`:`<textarea data-q="${q.id}" style="min-height:60px"></textarea><button data-qa="${q.id}">Submit</button>`}</td></tr>`).join("")}</table></div>`,
Conflicts:d=>`<div class="panel"><h2>Conflicts</h2><table><tr><th>ID</th><th>Type</th><th>Severity</th><th>Requirements</th><th>Detail</th><th>Resolution</th></tr>
  ${d.conflicts.map(c=>`<tr><td>${c.id}</td><td>${c.type}</td><td class="lvl-${c.severity}">${c.severity}</td><td>${chips(c.requirement_ids)}</td><td>${esc(c.detail)}</td><td class="${c.resolution?'ok':'warn'}">${esc(c.resolution||"OPEN")}</td></tr>`).join("")}</table></div>`,
Compliance:d=>`<div class="panel"><h2>Mandatory control coverage</h2><table><tr><th>Control</th><th>Title</th><th>Status</th><th>Covered by</th></tr>
  ${d.coverage.map(c=>`<tr><td>${c.control_id}${c.mandatory?"":" <span class='muted small'>(optional)</span>"}</td><td>${esc(c.title)}</td><td class="${c.status==='covered'?'ok':c.status==='derived'?'warn':'bad'}">${c.status}</td><td>${chips(c.covered_by)}</td></tr>`).join("")}</table></div>
  <div class="panel"><h2>Requirement → control → citation mappings</h2><table><tr><th>Req</th><th>Control</th><th>Citations</th><th>Obligation</th><th>Flags</th></tr>
  ${d.compliance.map(m=>`<tr><td>${m.requirement_id}</td><td>${m.control_id}<div class="small muted">${esc(m.control)}</div></td><td>${m.citations.map(c=>`<span class="chip" title="${esc(c.title)} · ${esc(c.source)} · v${esc(c.version)}">${c.kb_id}</span>`).join("")}</td>
  <td class="small">${esc(m.obligation)}</td><td>${m.gap?'<span class="bad">GAP</span> ':''}${m.needs_legal_review?'<span class="warn">legal review</span>':''}</td></tr>`).join("")}</table></div>`,
Risks:d=>`<div class="panel"><h2>Threat & risk register</h2><table><tr><th>ID</th><th>Risk</th><th>Cat.</th><th>L×I</th><th>Level</th><th>Mitigation</th><th>Owner</th></tr>
  ${d.risks.map(r=>`<tr><td>${r.id}</td><td><b>${esc(r.title)}</b><div class="small">${esc(r.description)}</div><div>${chips(r.linked_requirements.slice(0,8))}</div></td><td>${r.category}</td><td>${r.likelihood}×${r.impact}</td><td class="lvl-${r.level}">${r.level}</td><td class="small">${esc(r.mitigation)}</td><td>${r.owner}</td></tr>`).join("")}</table></div>`,
SDLC:d=>{const s=d.sdlc;if(!s)return `<div class="panel muted">Run the agents first.</div>`;
  return `<div class="panel"><h2>Recommended SDLC: ${esc(s.selected)} <span class="small s-${s.status}">(${s.status.replaceAll("_"," ")})</span></h2><p>${esc(s.explanation)}</p>
  ${s.ranked.map(o=>`<div style="margin:8px 0"><div class="row" style="justify-content:space-between"><b>${esc(o.model)}</b><span>${o.score}%</span></div><div class="bar"><span style="width:${o.score}%"></span></div><div class="small muted">${o.reasons.map(esc).join(" · ")}</div></div>`).join("")}</div>
  <div class="panel"><h2>Decision factors</h2><table><tr><th>Factor</th><th>Score</th><th>Rationale</th></tr>${s.factors.map(f=>`<tr><td>${f.name.replaceAll("_"," ")}</td><td>${"●".repeat(f.score)}${"○".repeat(5-f.score)}</td><td class="small">${esc(f.rationale)}</td></tr>`).join("")}</table></div>
  <div class="panel"><h2>Project-specific workflow</h2>${s.workflow.map((p,i)=>`<h3>${i+1}. ${esc(p.name)}</h3><table class="small">
   ${[["Activities",p.activities],["Roles",p.roles],["Deliverables",p.deliverables],["Security",p.security_activities],["Testing",p.testing],["Compliance checkpoints",p.compliance_checkpoints],["Entry",p.entry_criteria],["Exit",p.exit_criteria]].map(([l,a])=>a.length?`<tr><th style="width:170px">${l}</th><td>${a.map(esc).join("; ")}</td></tr>`:"").join("")}
   <tr><th>Approval gate</th><td><b>${esc(p.approval_gate)}</b></td></tr></table>`).join("")}</div>`},
Approvals:d=>`<div class="panel"><h2>Human approval queue</h2><p class="small muted">Decisions are checked against the role selected at the top right. The SDLC and production-readiness gates need every listed role to approve.</p>
  <div class="row"><select id="ap-filter"><option value="pending_approval">pending</option><option value="">all</option></select></div>
  <table><tr><th>ID</th><th>Gate</th><th>Summary</th><th>Required roles</th><th>Status</th><th>Decision</th></tr>
  ${d.approvals.map(a=>`<tr data-st="${a.status}"><td>${a.id}</td><td>${a.gate.replaceAll("_"," ")}</td><td class="small">${esc(a.summary)}${a.decisions.map(x=>`<div class="muted">${esc(x.user)} (${x.role}): ${x.decision} ${esc(x.comment||"")}</div>`).join("")}</td>
  <td>${chips(a.required_roles)}</td><td class="s-${a.status}">${a.status.replaceAll("_"," ")}</td>
  <td>${a.status==="pending_approval"?`<input type="text" data-c="${a.id}" placeholder="comment / modified text"><div class="row" style="margin-top:4px">${["approve","reject","modify","regenerate"].map(x=>`<button data-ap="${a.id}" data-d="${x}">${x}</button>`).join("")}</div>`:""}</td></tr>`).join("")}</table></div>`,
Audit:d=>`<div class="panel"><h2>Audit trail</h2><div id="audit">Loading…</div></div>`,
};

const BIND={
Overview:()=>{document.querySelectorAll("[data-sample]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{const r=await api(`/api/projects/from-sample/${b.dataset.sample}`,{method:"POST"});await refreshProjects(r.id);await load();toast("Case study loaded and analysed")}catch(e){toast(e.message)}finally{b.disabled=false}});
  const g=$("#np-go");if(g)g.onclick=async()=>{try{const r=await api("/api/projects",{method:"POST",body:JSON.stringify({name:$("#np-name").value||"New KYC project",jurisdictions:[$("#np-j").value]})});await refreshProjects(r.id);await load();S.tab="Inputs";render()}catch(e){toast(e.message)}};
  const rr=$("#rerun");if(rr)rr.onclick=async()=>{await api(`/api/projects/${S.pid}/run`,{method:"POST"});await load();toast("Agents re-run")}},
Inputs:()=>{$("#di-add").onclick=async()=>{try{const r=await api(`/api/projects/${S.pid}/documents`,{method:"POST",body:JSON.stringify({title:$("#di-title").value||"Input",text:$("#di-text").value,type:$("#di-type").value,stakeholder:$("#di-st").value,role:$("#di-role").value})});
  await api(`/api/projects/${S.pid}/run`,{method:"POST"});await load();toast(`Added ${r.id}: ${r.pii_masked} PII masked${r.injection_flags.length?", injection quarantined":""}`)}catch(e){toast(e.message)}}},
Interview:()=>{const st=$("#iv-start");if(st)st.onclick=async()=>{S.interview=await api(`/api/projects/${S.pid}/interviews`,{method:"POST",body:JSON.stringify({stakeholder:$("#iv-name").value||"Stakeholder",role:$("#iv-role").value})});render()};
  const sd=$("#iv-send");if(sd)sd.onclick=async()=>{S.interview=await api(`/api/projects/${S.pid}/interviews/${S.interview.id}/answer`,{method:"POST",body:JSON.stringify({answer:$("#iv-ans").value})});render()};
  const fn=$("#iv-finish");if(fn)fn.onclick=async()=>{await api(`/api/projects/${S.pid}/interviews/${S.interview.id}/finish`,{method:"POST"});S.interview=null;await load();S.tab="Requirements";render();toast("Interview analysed")}},
Requirements:()=>{const f=()=>{const c=$("#rq-cat").value,s=$("#rq-st").value;document.querySelectorAll("#rq tr[data-cat]").forEach(r=>r.classList.toggle("hidden",(c&&!r.dataset.cat.split(" ").includes(c))||(s&&r.dataset.st!==s)))};$("#rq-cat").onchange=f;$("#rq-st").onchange=f},
Clarifications:()=>{document.querySelectorAll("[data-qa]").forEach(b=>b.onclick=async()=>{const q=b.dataset.qa;const a=document.querySelector(`[data-q="${q}"]`).value;if(!a)return;
  try{await api(`/api/projects/${S.pid}/questions/${q}/answer`,{method:"POST",body:JSON.stringify({answer:a})});await load();toast("Answer applied; agents re-ran")}catch(e){toast(e.message)}})},
Approvals:()=>{const f=()=>{const v=$("#ap-filter").value;document.querySelectorAll("tr[data-st]").forEach(r=>r.classList.toggle("hidden",v&&r.dataset.st!==v))};$("#ap-filter").onchange=f;f();
  document.querySelectorAll("[data-ap]").forEach(b=>b.onclick=async()=>{const id=b.dataset.ap,d=b.dataset.d,c=document.querySelector(`[data-c="${id}"]`).value;
  try{await api(`/api/projects/${S.pid}/approvals/${id}`,{method:"POST",body:JSON.stringify({decision:d,comment:c,modification:d==="modify"?c:null})});await load();toast(`${id}: ${d} recorded`)}catch(e){toast("Denied: "+e.message)}})},
Audit:async()=>{const a=await api(`/api/projects/${S.pid}/audit`);$("#audit").innerHTML=`<p>Hash chain: ${a.verified?'<span class="ok">verified</span>':'<span class="bad">BROKEN</span>'} · head <code>${a.head.slice(0,24)}…</code> · ${a.events.length} events shown</p>
  <table><tr><th>#</th><th>Time</th><th>Actor</th><th>Action</th><th>Subject</th><th>Payload</th></tr>${a.events.slice().reverse().map(e=>`<tr><td>${e.seq}</td><td class="small">${e.ts}</td><td>${esc(e.actor)}</td><td>${esc(e.action)}</td><td>${esc(e.subject)}</td><td><pre>${esc(JSON.stringify(e.payload))}</pre></td></tr>`).join("")}</table>`},
};
init();
</script>
</body>
</html>
