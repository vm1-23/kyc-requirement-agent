[project]
name = "kyc-re"
version = "0.1.0"
description = "Agentic AI requirement-engineering and SDLC-recommendation system for KYC / customer onboarding"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-docx>=1.1",
]

[project.optional-dependencies]
docs = ["pypdf>=4"]
dev = ["pytest>=8", "httpx"]

[project.scripts]
kyc-re = "kyc_re.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kyc_re*"]

[tool.setuptools.package-data]
"kyc_re.knowledge" = ["data/*.json"]
"kyc_re.api" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
